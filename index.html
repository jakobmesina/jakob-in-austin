<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jakob in Austin</title>
<style>
/* Public family page, style A: progress rail left, step middle, big photo right. Light only. No rename, no codes. */
:root{--bg:#ffffff;--ink:#000000;--text:#1c1c1e;--mute:#8e8e93;--line:#e5e5ea;--fill:#f2f2f7;--blue:#007aff;--now:#eaf3ff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.wrap *{white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--ink);overflow:hidden}
.sub{font-size:15px;color:var(--mute);margin:6px 0 8px;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--ink)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,44%);column-gap:12px;align-items:center}
.row.np{grid-template-columns:28px minmax(0,1fr)}
@media (min-width:700px){.row{grid-template-columns:28px minmax(0,1fr) 360px}}
.rail{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.rail:before,.rail:after{content:"";position:absolute;left:13px;width:2px;background:var(--line)}
.rail:before{top:0;height:50%}.rail:after{top:50%;bottom:0}
.rail.ta:before,.rail.ba:after{background:var(--blue)}
.rail.nt:before,.rail.nb:after{display:none}
.dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px #c7c7cc;display:flex;align-items:center;justify-content:center}
.dot svg{width:14px;height:14px;display:none}
.done .dot{background:var(--blue);box-shadow:none}.done .dot svg{display:block}
.now .dot{width:28px;height:28px;box-shadow:inset 0 0 0 3px var(--blue),0 0 0 4px var(--now)}
.now .dot:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.tx{min-width:0;padding:10px;border-radius:14px}
.now .tx{background:var(--now)}
.tm{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--blue);line-height:1.3;min-width:0}
.pill{flex:none;font-size:12px;font-weight:800;color:#fff;background:var(--blue);border-radius:6px;padding:1px 6px;line-height:16px}
.ti{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.2;overflow:hidden}
.done .ti{color:#3a3a3c}
.fut .tx{opacity:.45}
.ph{display:block;padding-block:8px}
.ph span{display:block;width:100%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--fill)}
@media (min-width:700px){.ph span{aspect-ratio:4/3}}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.day .rail{min-height:56px}
.day h2{font-size:24px;font-weight:800;color:var(--ink);margin:0;padding:16px 10px 6px;overflow:hidden}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.jump{pointer-events:auto;max-width:100%;display:flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:24px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(0,122,255,.3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jump svg{flex:none;width:18px;height:18px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Jakob in Austin</h1>
  <p class="sub" id="sub"></p>
  <section id="view"></section>
</main>
<div class="dock"><button type="button" class="jump" id="jump"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg><span id="jumpT">Jump to now</span></button></div>
<script id="photos" type="application/json">[{"file": "800da718cafd2b5dad8e8934b538581f.jpg", "at": "2026-10-26T22:20:13.059Z", "label": "Check In", "checkpoint": "check-in"}, {"file": "130608e4819e1ecffd87502a5daf7985.jpg", "at": "2026-10-26T22:19:32.925Z", "label": "Land in Austin", "checkpoint": "land-in-austin"}, {"file": "c5e48af04d3abb83c1998c97906cf805.jpg", "at": "2026-10-26T22:18:25.955Z", "label": "Fly to Austin", "checkpoint": "fly-to-austin"}, {"file": "09899f410dfb30c4873023bea4941238.jpg", "at": "2026-10-26T15:39:37.847Z", "label": "At FlyAway (Van Nuys)", "checkpoint": "at-flyaway"}, {"file": "83ba681027e60e662d1f9f598e69ae84.jpg", "at": "2026-10-26T15:38:40.399Z", "label": "Boarding", "checkpoint": "boarding"}, {"file": "dff3f7afa017ebc5580fcedb1c2a6478.jpg", "at": "2026-10-26T15:33:20.499Z", "label": "Leave House", "checkpoint": "leave-house"}, {"file": "8e4947ab1ae3f718346f1403cebf3b30.jpg", "at": "2026-10-26T15:31:27.249Z", "label": "Get Off at Terminal 3", "checkpoint": "terminal-3"}, {"file": "d254179a01e42617792c9ee8eb5016f8.jpg", "at": "2026-10-26T15:05:55.363Z", "label": "FlyAway Leaves", "checkpoint": "flyaway-leaves"}]</script>
<script id="status" type="application/json">{"override":null}</script>
<script>
(function(){
// Steps: [checkpoint id, day, shown time, name, start instant]. LA steps Pacific (UTC-7), Austin steps Central (UTC-5).
var CP = [
  ["leave-house","Monday","6:15 AM","Leave House","2026-10-26T06:15:00-07:00"],
  ["at-flyaway","Monday","6:45 AM","At FlyAway (Van Nuys)","2026-10-26T06:45:00-07:00"],
  ["flyaway-leaves","Monday","7:00 AM","FlyAway Leaves","2026-10-26T07:00:00-07:00"],
  ["terminal-3","Monday","~8:00 AM","Get Off at Terminal 3","2026-10-26T08:00:00-07:00"],
  ["boarding","Monday","9:33 AM","Boarding","2026-10-26T09:33:00-07:00"],
  ["fly-to-austin","Monday","10:13 AM","Fly to Austin","2026-10-26T10:13:00-07:00"],
  ["land-in-austin","Monday","3:21 PM","Land in Austin","2026-10-26T15:21:00-05:00"],
  ["check-in","Monday","3–4 PM","Check In","2026-10-26T16:00:00-05:00"],
  ["welcome-party","Monday","6:30 PM","SubQ Welcome Party","2026-10-26T18:30:00-05:00"],
  ["subq-day-1","Tuesday","10:00 AM","SubQ Day 1","2026-10-27T10:00:00-05:00"],
  ["subq-day-2","Wednesday","10:00 AM","SubQ Day 2","2026-10-28T10:00:00-05:00"],
  ["check-out","Wednesday","11:00 AM","Check Out","2026-10-28T11:00:00-05:00"],
  ["leave-for-airport","Wednesday","~6:15 PM","Leave for Airport","2026-10-28T18:15:00-05:00"],
  ["fly-home","Wednesday","8:44 PM","Fly Home","2026-10-28T20:44:00-05:00"],
  ["land-in-la","Wednesday","10:05 PM","Land in LA","2026-10-28T22:05:00-07:00"]
];
var CK = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function j(id, d){ try{ return JSON.parse(document.getElementById(id).textContent) || d; }catch(e){ return d; } }
var photos = j("photos", []), status = j("status", {}), PH = {}, cur = -1;
// Newest photo per checkpoint.
photos.slice().sort(function(a,b){ return Date.parse(b.at) - Date.parse(a.at); }).forEach(function(p){ if(p.checkpoint && !PH[p.checkpoint]) PH[p.checkpoint] = "photos/" + p.file; });
CP.forEach(function(c){ c.t = Date.parse(c[4]); });
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function current(){ var n = Date.now(), k = -1; CP.forEach(function(c,i){ if(c.t <= n) k = i; }); return k; }
function austin(){ try{ return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",weekday:"short",hour:"numeric",minute:"2-digit"}).format(new Date()); }catch(e){ return ""; } }
function render(){
  cur = current();
  var h = "", day = "", last = CP.length-1;
  CP.forEach(function(c,i){
    if(c[1]!==day){ day = c[1]; h += '<div class="row np day"><div class="rail'+(i<=cur?' ta ba':'')+(i===0?' nt nb':'')+'"></div><h2>'+day+'</h2></div>'; }
    var st = i < cur ? "done" : i===cur ? "now" : "fut", p = PH[c[0]];
    var rc = "rail" + (i <= cur ? " ta" : "") + (i < cur ? " ba" : "") + (i===last ? " nb" : "");
    h += '<div class="row '+st+(p?'':' np')+'" id="s-'+c[0]+'">'
      + '<div class="'+rc+'"><span class="dot" aria-label="'+(st==="done"?"Done":st==="now"?"Now":"Coming up")+'">'+CK+'</span></div>'
      + '<div class="tx"><div class="tm"><span>'+esc(c[2])+'</span>'+(st==="now"?'<span class="pill">NOW</span>':'')+'</div><div class="ti">'+esc(c[3])+'</div></div>'
      + (p ? '<a class="ph" href="'+esc(p)+'" target="_blank" rel="noopener"><span><img alt="'+esc(c[3])+'" loading="lazy" src="'+esc(p)+'"></span></a>' : '')
      + '</div>';
  });
  document.getElementById("view").innerHTML = h;
  var a = austin(), o = status && status.override;
  var line = o && o.label ? '<b>'+esc(o.label)+'</b>'+(o.sub ? ' · '+esc(o.sub) : '') : (cur<0 ? 'Trip starts Monday 6:15 AM' : cur >= last ? 'Home in LA' : cur+' of '+CP.length+' steps done');
  document.getElementById("sub").innerHTML = (a ? 'Austin time <b>'+esc(a)+'</b> · ' : '') + line;
  document.getElementById("jumpT").textContent = cur<0 ? "Jump to start" : "Jump to now · " + CP[cur][3];
  fit();
}
// Headlines never wrap: shrink each one until it fits its line.
function fit(){ var a = document.querySelectorAll(".ti,h1"); for(var i=0;i<a.length;i++){ var n=a[i]; n.style.fontSize=""; var f=parseFloat(getComputedStyle(n).fontSize); while(n.scrollWidth>n.clientWidth+1 && f>13){ f-=1; n.style.fontSize=f+"px"; } } }
document.getElementById("jump").addEventListener("click", function(){
  var el = document.getElementById("s-"+CP[Math.max(cur,0)][0]); if(!el) return;
  var rm = false; try{ rm = matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  el.scrollIntoView({behavior: rm ? "auto" : "smooth", block: "center"});
});
window.addEventListener("resize", fit);
setInterval(render, 60000);
render();
})();
</script>
</body>
</html>
